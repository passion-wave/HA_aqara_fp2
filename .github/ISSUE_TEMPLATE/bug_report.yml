name: Fehler melden
description: Bereinigter Fehlerbericht ohne Zugangsdaten oder Mitschnitte
title: "[Fehler]: "
body:
  - type: markdown
    attributes:
      value: "Bitte keine Tokens, Passwörter, HAR-Dateien, cURL-Exporte, Gerätekennungen oder Rohantworten anhängen. Nutze die bereinigte Integrationsdiagnose."
  - type: input
    id: version
    attributes:
      label: Integrationsversion und Home-Assistant-Version
    validations:
      required: true
  - type: dropdown
    id: path
    attributes:
      label: Betroffener Bereich
      options:
        - Installation / Offline-Vorschau
        - Offline-Parser / Signaturvergleich
        - Bewusst gestartete lokale Leseprobe
        - Home-Assistant-Laufzeit
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Schritte, erwartetes und tatsächliches Verhalten
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Bereinigte Diagnose / Fehlerklasse
      description: Vor dem Einfügen nochmals auf persönliche Informationen prüfen.

